<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — LynxLogix.NET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Josefin+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html">LYNXLOGIX<small>CORRESPONDENCE</small></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="desk.html">Desk</a>
        <a href="house.html">House</a>
        <a href="owner.html">Owner</a>
        <a href="pay.html">Pass</a>
      </nav>
    </div>
  </header>
  <main class="wrap" style="padding:64px 0">
    <div class="kicker">Write the house</div>
    <h1>Contact.</h1>
    <p class="lede">Opens your mail client to hello@lynxlogix.net and keeps a local copy on this browser.</p>
    <form class="card" data-contact style="max-width:640px;margin-top:28px">
      <label>Name</label>
      <input name="name" required />
      <label>Email</label>
      <input name="email" type="email" required />
      <label>Intent</label>
      <select name="intent">
        <option>Desk seat</option>
        <option>Mangasm+</option>
        <option>House gift</option>
        <option>Press</option>
        <option>Other</option>
      </select>
      <label>Message</label>
      <textarea name="message" rows="6" required></textarea>
      <div class="row" style="margin-top:18px">
        <button class="btn solid" type="submit">Send</button>
        <a class="btn ghost" href="https://www.mangasm.app/">Mangasm home</a>
      </div>
    </form>
  </main>
  <footer class="footer wrap"><p>LynxLogix.NET</p></footer>
  <script src="js/site.js"></script>
</body>
</html>
